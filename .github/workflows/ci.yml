name: GenAI OTel Conformance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Discover test matrices ─────────────────────────────────────────
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      python-matrix: ${{ steps.matrices.outputs.python }}
      js-matrix: ${{ steps.matrices.outputs.js }}
      java-matrix: ${{ steps.matrices.outputs.java }}
      dotnet-matrix: ${{ steps.matrices.outputs.dotnet }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate matrices
        id: matrices
        run: |
          # Python: scan for test_*.py files
          python_matrix='{"test":['
          first=true
          for f in tests/python/*/test_*.py; do
            dir=$(basename "$(dirname "$f")")
            variant=$(basename "$f" .py | sed 's/^test_//')
            reqs="tests/python/${dir}/requirements-${variant}.txt"
            [[ -f "$reqs" ]] || continue
            name="${dir}-${variant}"
            $first || python_matrix+=','
            first=false
            python_matrix+="{\"name\":\"${name}\",\"file\":\"${f}\",\"reqs\":\"${reqs}\",\"lib\":\"${dir}\",\"eco\":\"${variant}\"}"
          done
          python_matrix+=']}'
          echo "python=${python_matrix}" >> "$GITHUB_OUTPUT"

          # JS: scan for test_*.ts files
          js_matrix='{"test":['
          first=true
          for f in tests/js/*/test_*.ts; do
            dir=$(basename "$(dirname "$f")")
            variant=$(basename "$f" .ts | sed 's/^test_//')
            name="${dir}-${variant}"
            $first || js_matrix+=','
            first=false
            js_matrix+="{\"name\":\"${name}\",\"dir\":\"tests/js/${dir}\",\"lib\":\"${dir}\",\"eco\":\"${variant}\"}"
          done
          js_matrix+=']}'
          echo "js=${js_matrix}" >> "$GITHUB_OUTPUT"

          # Java: discover committed data files so only real test modules/ecosystems are included
          java_matrix='{"test":['
          first=true
          for f in tests/java/*/data-*.json; do
            [[ -f "$f" ]] || continue
            dir=$(basename "$(dirname "$f")")
            eco=$(basename "$f" .json | sed 's/^data-//')
            name="${dir}-${eco}"
            $first || java_matrix+=','
            first=false
            java_matrix+="{\"name\":\"${name}\",\"dir\":\"tests/java/${dir}\",\"lib\":\"${dir}\",\"eco\":\"${eco}\"}"
          done
          java_matrix+=']}'
          echo "java=${java_matrix}" >> "$GITHUB_OUTPUT"

          # .NET: discover committed data files so only real test modules/ecosystems are included
          dotnet_matrix='{"test":['
          first=true
          for f in tests/dotnet/*/data-*.json; do
            [[ -f "$f" ]] || continue
            dir=$(basename "$(dirname "$f")")
            eco=$(basename "$f" .json | sed 's/^data-//')
            name="${dir}-${eco}"
            $first || dotnet_matrix+=','
            first=false
            dotnet_matrix+="{\"name\":\"${name}\",\"dir\":\"tests/dotnet/${dir}\",\"lib\":\"${dir}\",\"eco\":\"${eco}\"}"
          done
          dotnet_matrix+=']}'
          echo "dotnet=${dotnet_matrix}" >> "$GITHUB_OUTPUT"

  # ── Python Tests ───────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Weaver
        run: .github/scripts/install-weaver.sh

      - name: Run conformance test
        run: python run_test.py "python-${{ matrix.test.name }}"

      - name: Check data file is up to date
        run: |
          git diff --exit-code -- 'tests/python/${{ matrix.test.lib }}/data-*.json'
          untracked=$(git ls-files --others --exclude-standard -- 'tests/python/${{ matrix.test.lib }}/data-*.json')
          if [ -n "$untracked" ]; then echo "Untracked data files: $untracked"; exit 1; fi

      - name: Stage results for upload
        if: always()
        run: |
          src="tests/python/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          dest="ci-results/python/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          mkdir -p "$dest" && cp -r "$src/." "$dest/" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: results-python-${{ matrix.test.name }}
          path: ci-results/

  # ── Java Tests ─────────────────────────────────────────────────────
  java:
    runs-on: ubuntu-latest
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.java-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Weaver
        run: .github/scripts/install-weaver.sh

      - name: Run conformance test
        run: python run_test.py "java-${{ matrix.test.name }}"

      - name: Check data file is up to date
        run: |
          git diff --exit-code -- 'tests/java/${{ matrix.test.lib }}/data-*.json'
          untracked=$(git ls-files --others --exclude-standard -- 'tests/java/${{ matrix.test.lib }}/data-*.json')
          if [ -n "$untracked" ]; then echo "Untracked data files: $untracked"; exit 1; fi

      - name: Stage results for upload
        if: always()
        run: |
          src="tests/java/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          dest="ci-results/java/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          mkdir -p "$dest" && cp -r "$src/." "$dest/" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: results-java-${{ matrix.test.name }}
          path: ci-results/

  # ── .NET Tests ─────────────────────────────────────────────────────
  dotnet:
    runs-on: ubuntu-latest
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.dotnet-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Weaver
        run: .github/scripts/install-weaver.sh

      - name: Build .NET test
        run: dotnet build ${{ matrix.test.dir }}/

      - name: Run conformance test
        run: python run_test.py "dotnet-${{ matrix.test.name }}"

      - name: Check data file is up to date
        run: |
          git diff --exit-code -- 'tests/dotnet/${{ matrix.test.lib }}/data-*.json'
          untracked=$(git ls-files --others --exclude-standard -- 'tests/dotnet/${{ matrix.test.lib }}/data-*.json')
          if [ -n "$untracked" ]; then echo "Untracked data files: $untracked"; exit 1; fi

      - name: Stage results for upload
        if: always()
        run: |
          src="tests/dotnet/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          dest="ci-results/dotnet/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          mkdir -p "$dest" && cp -r "$src/." "$dest/" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: results-dotnet-${{ matrix.test.name }}
          path: ci-results/

  # ── JS/TS Tests ────────────────────────────────────────────────────
  js:
    runs-on: ubuntu-latest
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.js-matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Weaver
        run: .github/scripts/install-weaver.sh

      - name: Run conformance test
        run: python run_test.py "js-${{ matrix.test.name }}"

      - name: Check data file is up to date
        run: |
          git diff --exit-code -- 'tests/js/${{ matrix.test.lib }}/data-*.json'
          untracked=$(git ls-files --others --exclude-standard -- 'tests/js/${{ matrix.test.lib }}/data-*.json')
          if [ -n "$untracked" ]; then echo "Untracked data files: $untracked"; exit 1; fi

      - name: Stage results for upload
        if: always()
        run: |
          src="tests/js/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          dest="ci-results/js/${{ matrix.test.lib }}/results/${{ matrix.test.eco }}"
          mkdir -p "$dest" && cp -r "$src/." "$dest/" 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: results-js-${{ matrix.test.name }}
          path: ci-results/

  # ── Dashboard ──────────────────────────────────────────────────────
  dashboard:
    runs-on: ubuntu-latest
    needs: [python, java, dotnet, js]
    if: always()
    steps:
      - name: Check for upstream failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more upstream jobs failed or were cancelled"
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install dashboard dependencies
        run: uv pip install --system jinja2

      - name: Generate dashboard
        run: python generate_dashboard.py --output-dir docs

      - name: Download all result artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tests
          pattern: results-*
          merge-multiple: true

      - name: Generate details page
        run: python generate_dashboard.py --output-dir docs

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dashboard
          path: docs/

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/

  # ── Deploy to GitHub Pages ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dashboard
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
