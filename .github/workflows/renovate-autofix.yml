name: Renovate Data Autofix

# Automatically commit updated data-*.json files on Renovate PRs.
#
# When a dependency update changes the telemetry a library produces, the
# conformance tests detect the difference and CI fails at the "Check data
# file is up to date" step.  This workflow picks up the result artifacts
# from that CI run, regenerates the data files, and pushes — triggering a
# fresh CI run that passes.
#
# Requires a repo secret AUTOFIX_TOKEN containing a PAT (or fine-grained
# token) with "contents: write" permission on this repo.  A PAT is needed
# (instead of the default GITHUB_TOKEN) so that the push triggers a new
# CI workflow run.

on:
  workflow_run:
    workflows: ["GenAI OTel Conformance Tests"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: renovate-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request context
        id: context
        run: |
          set -e
          if [[ -z "$AUTOFIX_TOKEN" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AUTOFIX_TOKEN secret is not set — skipping data file autofix."
            exit 0
          fi

          pr_count=$(jq '.workflow_run.pull_requests | length' "$GITHUB_EVENT_PATH")
          if [ "$pr_count" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_ref=$(jq -r '.workflow_run.pull_requests[0].base.ref' "$GITHUB_EVENT_PATH")
          head_repo=$(jq -r '.workflow_run.head_repository.full_name // ""' "$GITHUB_EVENT_PATH")

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "same_repo=$([ "$head_repo" = "$GITHUB_REPOSITORY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.same_repo == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.AUTOFIX_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.same_repo == 'true'
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.same_repo == 'true'
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: workflow-artifacts
          pattern: results-*
          merge-multiple: true

      - name: Regenerate data files from CI artifacts
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.same_repo == 'true'
        run: |
          set -e
          git fetch origin "${{ steps.context.outputs.base_ref }}"
          python .github/scripts/renovate_autofix_data.py \
            --base-ref "origin/${{ steps.context.outputs.base_ref }}" \
            --artifacts-dir workflow-artifacts

      - name: Commit data file updates
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.same_repo == 'true'
        run: |
          set -e
          if git diff --quiet -- 'tests/*/*/data-*.json'; then
            echo "No generated data file updates to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/*/*/data-*.json
          git commit -m "Update generated data files"
          git push origin "HEAD:${{ github.event.workflow_run.head_branch }}"
          git push origin "HEAD:${{ github.event.workflow_run.head_branch }}"
