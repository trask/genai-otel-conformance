# Spring AI test application properties
spring.application.name=spring-ai-conformance-test

# Point at mock LLM server
spring.ai.openai.base-url=${MOCK_LLM_URL}
spring.ai.openai.api-key=mock-key
spring.ai.openai.chat.options.model=gpt-4o-mini

# OTel export
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}
management.otlp.tracing.transport=grpc
management.tracing.sampling.probability=1.0

# Exit after running
spring.main.web-application-type=none
